services:
  app_proxy:
    environment:
      APP_HOST: cryptocode-ecash-solo_dashboard_1
      APP_PORT: 3000

  # ---------------------------------------------------------------- eCash node
  node:
    image: ghcr.io/andreashetem-cloud/ecash-abc:0.33.9@sha256:4789077e14908ed4e70b92b9243c3d976887735b6bf25dfd46ebfc2645adbe76
    # Na de eerste build: plak hier @sha256:<digest> achter de tag.
    restart: on-failure
    stop_grace_period: 10m
    ports:
      - "8433:8433" # P2P. Forward deze poort in je router voor inbound peers.
    volumes:
      - ${APP_DATA_DIR}/data/abc:/data
    environment:
      # 0 = volledige chain. Anders MiB, bv. 20000 voor een 20 GB pruned node.
      ABC_PRUNE: "0"
      ABC_DBCACHE: "2000"

  # ------------------------------------------------------- solo stratum server
  ckpool:
    image: ghcr.io/andreashetem-cloud/ecash-ckpool:pr11@sha256:44a342a3f4e219ff17f7cc0ff62c6f66f3b1cdb3d7484fc266215d79efa7867a
    restart: on-failure
    depends_on:
      - node
    ports:
      - "3333:3333" # stratum. Hier wijs je je miners naartoe.
    volumes:
      - ${APP_DATA_DIR}/data/abc:/abc:ro
      - ${APP_DATA_DIR}/data/ckpool:/ckpool
    environment:
      CK_BTCSIG: "/cryptocode solo/"
      CK_DONATION: "0.0" # % naar de ckpool-auteur. 0.0 = alles voor jou.
      CK_STARTDIFF: "1000"
      CK_MINDIFF: "100"

  # ----------------------------------------------------------------- dashboard
  dashboard:
    image: ghcr.io/andreashetem-cloud/ecash-dashboard:1.0.0@sha256:81d532f350cc21614eb93d02d8a9ef32433359eb2f381b394a5a07cf062c65b5
    restart: on-failure
    depends_on:
      - ckpool
    volumes:
      - ${APP_DATA_DIR}/data/abc:/abc:ro
      - ${APP_DATA_DIR}/data/ckpool:/ckpool:ro
    environment:
      # Wordt alleen getoond als hint in het dashboard.
      STRATUM_HINT: "${DEVICE_DOMAIN_NAME:-umbrel.local}:3333"
