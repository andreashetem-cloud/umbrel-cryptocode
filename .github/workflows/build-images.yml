name: build-images

# Bouwt en pusht de drie images naar ghcr.io/andreashetem-cloud/.
# Handmatig starten via de Actions-tab, of automatisch bij een tag v*.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ecash-abc
            context: cryptocode-ecash-solo/docker/abc
            tag: "0.33.9"
          - name: ecash-ckpool
            context: cryptocode-ecash-solo/docker/ckpool
            tag: "pr11"
          - name: ecash-dashboard
            context: cryptocode-ecash-solo/docker/dashboard
            tag: "1.0.0"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # LET OP: alleen linux/amd64. De Bitcoin ABC Dockerfile haalt de
      # x86_64-tarball op, dus arm64 zou falen. Voor de Blackview MP100 is
      # dit genoeg; voor Raspberry Pi zou de aarch64-tarball nodig zijn.
      - name: Build & push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/andreashetem-cloud/${{ matrix.name }}:${{ matrix.tag }}
            ghcr.io/andreashetem-cloud/${{ matrix.name }}:latest

      - name: Toon digest voor docker-compose.yml
        run: |
          echo "ghcr.io/andreashetem-cloud/${{ matrix.name }}:${{ matrix.tag }}@${{ steps.build.outputs.digest }}"
